<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clone Amazon Web</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--Create a Web page layout with a header, a footer & a content area
    containing 3 divs. Set the height & width of divs to 100px.
    Add the previous navbar in the header-->
    <header>
        <!--Create navbar in header-->
        <div id="navbar">
        <!--create anchor tags with link-->
            <a id="logo">amazon.in</a>
            <a href="#">Account</a>
            <a href="#">My Cart</a>
            <a href="#">Contact Us</a>
            <input placeholder="Search Amaoz.in">
            <button>Search</button>
        </div>
    </header>

    <div id="content">
        <!--give background color for all div here with 0.5 opacity-->
        <div class="contentbox" style="background-color:rgba(255,0,0, 0.5) ;">Buy laptop</div>
        <div class="contentbox" style="background-color: rgb(0, 255, 0,0.5);">Buy Clothes</div>
        <div class="contentbox" style="background-color: rgb(0,0,255,0.5);">Buy Mobiles</div>
    </div>

    <footer>
        Made with ♥ by Amazon <br>
        &copy; 1996-2026, Amazon.com, Inc. or its affiliates

    </footer>





</body>
</html>
