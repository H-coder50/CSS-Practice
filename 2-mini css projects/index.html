<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mini css projects</title>
    <link rel="stylesheet" href="style.css">
</head>
    <h1>Mini CSS Projects</h1>
<body>
    <!-- 1. Create a simple div with an id "box"
    Add some text content inside the div
    Set its background color to blue-->
    <div id="box">
        This is my project for practice html & css basics.    
    </div>

    <!-- 2.Create three headings h1, h2 & h3
    Give them all a class "heading" & set color of heading to red-->
    <h1 class="heading">Mini Project</h1>
    <h2 class="heading">Mini Project</h2>
    <h3 class="heading">Mini Project</h3>

    <!-- 3.Create a button & set its background color to:
    * green using css stylesheet
    * pink using inline style-->
    <button>Click me</button>
    <button style="background-color: rgb(232, 60, 198);">OK</button>


</body>
</html>
