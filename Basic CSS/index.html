<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic CSS</title>
    <!--for link html file to css file-->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Hello World</h1>
    
    <!--Color Property jo yahan text likhenge uska color css me hoga-->
    <h3>Color Property</h3>
    <p>This color property shows css color</p>

    <!--Button-->
    <h4>Button</h4>
    <button>Click me</button>

    <!--for Id Selector we use Id in html and css-->
    <h2 id="id1">Id Selecor 1</h2>
    <h2 id="id2">Id Selecor 2</h2>
    <h2 id="id3">Id Selecor 3</h2>
    
    <!--for Class Selector we use class jo sb ko aik hi color dega-->
    <h2 class="class1">class1 Selecor</h2>
    <p class="class1">class1 Selecor used same class id for
        <br> whole heading and paragraph</p>
    
    <!--Create a simple div with an id -->    

</body>
</html>
