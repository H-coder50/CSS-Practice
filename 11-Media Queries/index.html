    <h1>Media Queries</h1>
    <!-- Media Queries are a feature of CSS that allows us to make a website 
    responsive by applying different styles to different screen sizes and devices, 
    such as mobile phones, tablets, and laptops.
In easy words:
Media Queries help us adjust the design of a website according to the screen size.
For example:
- On a laptop, a heading may appear in 40px.
- On a tablet, the same heading may appear in 30px.
- On a mobile phone, it may appear in 20px. -->
