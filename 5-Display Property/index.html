<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Property</title>
    <link rel="stylesheet" href="style.css">
</head>
    <h1>Display Property</h1>
<body>
    <!--The display property in CSS controls how an HTML element behaves and 
    how it occupies space on the webpage.
1. block        (occupy all space)
2. inline       (occupy just it required space)
3. inline-block (similar to inline but set margin & padding )
4. none         (To remove element from document flow)
    --> 
    <!--div, h1 etc block element-->
    <h3 id="h1">Block Element</h3>
    <h3 id="h2">Block Element</h3>
    <br><br>
    <!--button, a, input etc inline element-->
    <button id="b1">click me</button>
    <button id="b2">click me</button>
    <br><br>

    <!--we can set style in html-->
    <div style="background-color: blue;">Box1</div>
    <div style="background-color: rgb(225, 12, 175);">Box2</div>
    <div style="background-color: rgb(17, 197, 77);">Box3</div>

    <br><br>
    <br><br>

    <h3 style="background-color: darksalmon;">Box1</h3>
    <h3 style="background-color: rgb(137, 209, 95);">Box2</h3>
    <h3 style="background-color: rgb(197, 78, 210);">Box3</h3>



</body>
</html>
